DATA:
  MAX_SAMPLE_INTERVAL: 200
  HORIZONTAL_FLIP_PROBABILITY: 0.0
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  - 0.449
  - 0.449
  - 0.449
  SEARCH:
    CENTER_JITTER: 3.0
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 2
  STD:
  - 0.229
  - 0.224
  - 0.225
  - 0.226
  - 0.226
  - 0.226
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 1
  TRAIN:
    DATASETS_NAME:
    - DepthTrack_train_main
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME:
    - DepthTrack_train_val
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000
  DEPTH_TRACK_HOLDOUT_RATIO: 0.1
  DEPTH_TRACK_HOLDOUT_SEED: 2026
MODEL:
  PRETRAIN_FILE: "OSTrack_ep0300.pth.tar"
  PRETRAIN_ENV: "RGBDL_OSTRACK_PRETRAIN"
  EXTRA_MERGER: False
  RETURN_INTER: False
  LANGUAGE:
    USE: True
    MODEL_NAME_OR_PATH: "roberta-base"
    MODEL_PATH_ENV: "RGBDL_ROBERTA_MODEL"
    LOCAL_FILES_ONLY: True
    FREEZE: True
    MAX_LENGTH: 48
    DROPOUT: 0.1
    RESIDUAL_WEIGHT: 0.10
  BACKBONE:
    TYPE: vit_base_patch16_224_mplt
    STRIDE: 16
    MPLT_LOC: [3, 6, 9]
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  MPLT_DROP_PATH: [0.0, 0.0, 0.0]
  SOT_PRETRAIN: False
  BATCH_SIZE: 1
  EPOCH: 15
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.000075
  LR_DROP_EPOCH: 10
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 5
  WEIGHT_DECAY: 0.0001
  AMP: True
  LANGUAGE_TEXT_MODE: current
TEST:
  EPOCH: 15
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  LANGUAGE_TEXT_MODE: initial
